name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bats-core/bats-action@3.0.0

      # PyYAML is only needed by the pnpm assertions; installing it here turns
      # a missing dependency into an explicit step instead of an ImportError
      # buried in a test.
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml

      # Tool versions mirror the pins in `scripts/check`; bump them together.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: check

      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: format --check

      - name: shellcheck
        run: shellcheck -x bin/proxysw scripts/check tests/helpers/fixture.bash

      - name: bats
        run: bats tests/
