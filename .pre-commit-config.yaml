# Hooks that keep the repository's gate honest before a commit is created.
# Install once with `pre-commit install`.
#
# The tool versions here must match the pins in `scripts/check`; that script is
# the local spelling of the same three tools, and CI runs them as steps.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [-x]
        files: '^(bin/proxysw|scripts/.*|tests/.*\.bash)$'

  # The suite is the only thing that proves the carriers still write the bytes
  # they promise. It runs through `scripts/check test` so the hook and a local
  # run cannot drift apart. Serial (no --jobs) keeps the hook free of the
  # flock/parallel dependency.
  - repo: local
    hooks:
      - id: bats
        name: bats
        entry: ./scripts/check test
        language: system
        pass_filenames: false
